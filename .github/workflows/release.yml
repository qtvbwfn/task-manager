name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 构建 ${{ matrix.arch }}
        run: ./make_app.sh ${{ matrix.arch }}

      - name: 打包 zip
        run: |
          ditto -c -k --keepParent "任务管理器-${{ matrix.arch }}.app" "TaskManager-macOS-${{ matrix.arch }}.zip"
          unzip -l "TaskManager-macOS-${{ matrix.arch }}.zip" | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: TaskManager-macOS-${{ matrix.arch }}
          path: TaskManager-macOS-${{ matrix.arch }}.zip

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
